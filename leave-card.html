<title>請假卡列印 - 彰化轉運中心</title>
<style>
  :root{ --g:#1f8a53; --lt:#8fc7ab; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#e5e7eb; font-family:"Microsoft JhengHei","微軟正黑體",sans-serif; }

  /* ================= 工具列（不列印） ================= */
  #bar{
    position:sticky; top:0; z-index:50; background:#065f46; color:#fff;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 14px; box-shadow:0 2px 6px rgba(0,0,0,.25); font-size:14px;
  }
  #bar b{ font-size:16px; margin-right:6px; }
  #bar a{ color:#a7f3d0; text-decoration:none; }
  #bar input[type=text], #bar input[type=number]{
    width:64px; padding:3px 6px; border:none; border-radius:6px; font-size:14px;
  }
  #bar button{
    padding:5px 12px; border:none; border-radius:8px; cursor:pointer;
    background:#0d9488; color:#fff; font-size:14px;
  }
  #bar button:hover{ filter:brightness(1.1); }
  #bar button.on{ background:#f59e0b; color:#111; }
  #bar button.print{ background:#f3f4f6; color:#065f46; font-weight:bold; }
  .spacer{ flex:1; }

  /* ================= 名冊面板（不列印） ================= */
  #panel{
    background:#fff; margin:10px auto; max-width:1120px; border-radius:12px;
    padding:12px 16px; box-shadow:0 1px 4px rgba(0,0,0,.15); font-size:14px;
  }
  #panel .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  #panel select{ padding:3px 6px; }
  #emps{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px; }
  #emps label{ display:flex; align-items:center; gap:5px; padding:3px 6px; border-radius:6px; cursor:pointer; }
  #emps label:hover{ background:#f0fdf4; }
  #emps .u{ color:#888; font-size:12px; }
  #hint{ color:#666; font-size:13px; }

  /* ================= 請假卡版面 ================= */
  .page{
    width:297mm; height:210mm; background:#fff;
    margin:6mm auto; padding:0;
    position:relative; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    font-family:"DFKai-SB","標楷體","BiauKai","Kaiti TC",serif; color:var(--g);
  }
  @page{ size:A4 landscape; margin:0; }
  @media print{
    body{ background:#fff; }
    #bar,#panel{ display:none !important; }
    .page{ margin:0; box-shadow:none; page-break-after:always; }
  }
  .page table{ border-collapse:collapse; }

  /* ---------- 正面表頭區 ---------- */
  .hdr{ position:absolute; top:8mm; left:0; right:0; height:23mm; }
  .hdr-left{ position:absolute; left:13mm; top:2.5mm; font-size:11pt; }
  .hdr-left .l2{ margin-top:4.6mm; }
  .hdr-mid{ position:absolute; left:105mm; width:80mm; text-align:center; }
  .hdr-right{ position:absolute; left:185mm; top:2mm; font-size:10.5pt; line-height:1.6; }
  .blank{
    display:inline-block; border-bottom:0.35mm solid var(--g); min-height:1em;
    vertical-align:bottom; text-align:center; outline:none;
  }
  .blank:focus{ background:#fefce8; }
  .co{ font-size:14.5pt; font-weight:bold; letter-spacing:2mm; text-indent:2mm; white-space:nowrap; }
  .cardtitle{ font-size:14.5pt; font-weight:bold; letter-spacing:12mm; text-indent:12mm; border-bottom:0.4mm solid var(--g); display:inline-block; padding:1mm 3mm 0.5mm 3mm; margin-top:2mm; white-space:nowrap; }

  /* ---------- 正面主表 ---------- */
  .bodywrap{ position:absolute; top:31mm; left:2.5mm; right:5mm; display:flex; }
  .sidenote{
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:8.2pt; letter-spacing:0.2mm; line-height:1;
    width:5mm; margin-top:0.5mm;
  }
  .main{ flex:1; }
  table.grid{ width:100%; table-layout:fixed; border:0.55mm solid var(--g); }
  table.grid th, table.grid td{
    border:0.25mm solid var(--g);
    text-align:center; vertical-align:middle; overflow:hidden; font-weight:normal;
  }
  table.grid th{ font-size:10pt; height:4.5mm; }
  th.small{ font-size:7pt; padding:0; letter-spacing:0; white-space:nowrap; }
  td.lt, th.ltb{ border-top-width:0.12mm; border-top-color:var(--lt); border-bottom-width:0.12mm; border-bottom-color:var(--lt); }
  td.row{ height:7.55mm; }
  .dcell{ font-size:9pt; white-space:nowrap; padding:0 !important; }
  .dflex{ display:flex; align-items:center; height:100%; }
  .dflex .m{ margin-left:14%; }
  .dflex .d{ margin:0 auto; }
  .ampm{ display:inline-block; font-size:6.2pt; line-height:1.15; text-align:left; vertical-align:middle; margin-right:0.6mm; }

  /* ---------- 特休排定 ---------- */
  .sv-label{ position:absolute; top:157.5mm; left:17.4mm; font-size:10.5pt; }
  table.sv{ position:absolute; top:163.5mm; left:18.3mm; width:273.7mm; table-layout:fixed; border:0.4mm solid var(--g); }
  table.sv th, table.sv td{ border:0.25mm solid var(--g); font-weight:normal; text-align:center; }
  table.sv th{ font-size:10pt; height:5.1mm; }
  table.sv td{ height:9.5mm; }

  /* ---------- 註 ---------- */
  .notes{ position:absolute; top:181.5mm; left:17.4mm; right:4mm; font-size:9.4pt; line-height:1.42; }
  .notes .n1{ display:flex; }
  .notes .n1 .lbl{ white-space:nowrap; }
  .notes ol{ list-style:none; }
  .notes li{ text-indent:-1.7em; padding-left:1.7em; }

  /* ---------- 反面 ---------- */
  .backtable{
    position:absolute; top:20.8mm; left:6.6mm; width:267.8mm; height:166.8mm;
    display:flex; flex-direction:row; border:0.55mm solid var(--g);
  }
  .col{ display:flex; flex-direction:column; border-left:0.3mm solid var(--g); overflow:hidden; }
  .col:first-child{ border-left:none; }
  .col-h{
    height:19mm; flex:none; display:flex; align-items:center; justify-content:center;
    border-bottom:0.3mm solid var(--g); font-size:12pt; letter-spacing:2mm; text-indent:2mm;
    white-space:nowrap; overflow:hidden;
  }
  .col-h.tight{ letter-spacing:0.5mm; text-indent:0.5mm; font-size:11pt; }
  .col-b{
    flex:1; min-height:0; writing-mode:vertical-rl; font-size:8.4pt; line-height:1.4; letter-spacing:0.4mm;
    padding:2.5mm 1.6mm 2mm 1mm; overflow:hidden;
  }
  .col-b p{ margin:0; }
  .btitle{
    position:absolute; right:4mm; top:44mm; width:16mm;
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:13.5pt; font-weight:bold; letter-spacing:8mm; text-align:left;
  }
  .bsub{
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:11pt; letter-spacing:7.5mm; padding-top:8mm;
  }
  .funeral-bottom{ border-top:0.3mm solid var(--g); flex:none; display:flex; flex-direction:row; height:82mm; }
  .fcell{ flex:1; display:flex; flex-direction:column; border-left:0.3mm solid var(--g); }
  .fcell:first-child{ border-left:none; }
  .fcell .ftext{ flex:1; writing-mode:vertical-rl; font-size:8.2pt; line-height:1.4; letter-spacing:0.3mm; padding:1.5mm 0.8mm; }
  .fcell .fday{ border-top:0.3mm solid var(--g); text-align:center; font-size:11pt; height:8.2mm; line-height:8.2mm; }
  .backfoot{ position:absolute; left:7.5mm; top:190.5mm; font-size:9.6pt; }
  .backfoot2{ position:absolute; left:199mm; top:193.5mm; font-size:9.6pt; }
</style>

const pad2 = n => String(n).padStart(2,"0");
function rocFmt(s){ /* "91/3/27" -> "91/03/27" */
  if(!s) return "";
  const p = String(s).split("/");
  if(p.length !== 3) return s;
  return `${p[0]}/${pad2(p[1])}/${pad2(p[2])}`;
}
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function blankSpan(v, w){
  return `<span class="blank" contenteditable="true" style="min-width:${w}mm">${esc(v||"")}</span>`;

function cardFor(d){ return frontPage(d) + backPage(); }

/* ================= 畫面邏輯 ================= */
function renderBlank(){
  $("cards").innerHTML = cardFor({year:"",empNo:"",unit:"",name:"",d1:"",n1:"",d2:"",n2:"",hire:""});
}

async function loadEmps(){
  if(employees.length) return;
  try{
    const r = await fetch(`${SB_URL}/att_employees?select=seq,name,emp_no,hire_date,unit,active&active=eq.true&order=seq`, {headers:H});
    employees = await r.json();
  }catch(e){
    $("emps").textContent = "名冊載入失敗，請檢查網路後重新整理。";
    return;
  }
  drawEmpList();
}

function drawEmpList(){
  const uf = $("unitSel").value;
  const list = employees.filter(e => uf==="all" || e.unit===uf);
  $("emps").innerHTML = list.map(e =>
    `<label><input type="checkbox" class="empCk" value="${esc(e.emp_no)}" checked> ${esc(e.name)} <span class="u">${esc(e.emp_no)}·${esc(e.unit||"")}</span></label>`
  ).join("") || "（此單位沒有在職員工）";
}

function genCards(){
  const year = $("yearIn").value.trim();
  const unit = $("unitIn").value.trim();
  const picked = new Set([...document.querySelectorAll(".empCk:checked")].map(c=>c.value));
  const list = employees.filter(e => picked.has(e.emp_no));
  if(!list.length){ alert("請至少勾選一位員工"); return; }
  $("cards").innerHTML = list.map(e => {
    const hp = String(e.hire_date||"").split("/");
    const anniv = hp.length===3 ? `${year}/${pad2(hp[1])}/${pad2(hp[2])}` : "";
    return cardFor({
      year, empNo:e.emp_no, unit, name:e.name,
      d1:`${year}/01/01`, n1:"", d2:anniv, n2:"",
      hire:rocFmt(e.hire_date)
    });
  }).join("");
}

$("modeBlank").onclick = () => {
  mode="blank";
  $("modeBlank").classList.add("on"); $("modeBatch").classList.remove("on");
  $("panel").style.display="none";
  renderBlank();
};
$("modeBatch").onclick = () => {
  mode="batch";
  $("modeBatch").classList.add("on"); $("modeBlank").classList.remove("on");
  $("panel").style.display="";
  loadEmps();
};
$("unitSel").onchange = drawEmpList;
$("selAll").onclick = () => document.querySelectorAll(".empCk").forEach(c=>c.checked=true);
$("selNone").onclick = () => document.querySelectorAll(".empCk").forEach(c=>c.checked=false);
$("genBtn").onclick = genCards;
$("printBtn").onclick = () => window.print();

renderBlank();
</script>
</body>
