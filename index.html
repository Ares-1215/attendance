<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彰化轉運中心 出勤表</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<script src="xlsx.bundle.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e2e8f0; --txt:#1e293b; --sub:#64748b;
  --brand:#1d4ed8; --brand-light:#eff6ff;
  --wknd:#fff7ed; --today:#fef9c3; --wkndH:#ffedd5; --wkndHt:#c2410c; --todayHt:#a16207;
  --head:#f8fafc; --footbg:#eef2ff; --hover:#f0f9ff; --hoverBtn:#f1f5f9;
  --wkndHover:#fde8d0; --todayHover:#fef08a;
  --gate1:#1e3a8a; --gate2:#1d4ed8;
}
html[data-theme="dark"]{
  --bg:#0b1220; --card:#151e2e; --line:#2b3950; --txt:#e2e8f0; --sub:#8fa0b5;
  --brand:#3b82f6; --brand-light:#1e293b;
  --wknd:#2a2118; --today:#3a3413; --wkndH:#3a2c1c; --wkndHt:#fdba74; --todayHt:#fde047;
  --head:#1a2436; --footbg:#1d2a47; --hover:#1c2940; --hoverBtn:#22304a;
  --wkndHover:#3b2f1f; --todayHover:#474017;
  --gate1:#0b1220; --gate2:#1e3a8a;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:"Microsoft JhengHei","Segoe UI",sans-serif; background:var(--bg); color:var(--txt); font-size:14px; transition:background .25s;}
/* ===== 登入 ===== */
#gate{position:fixed; inset:0; background:linear-gradient(135deg,var(--gate1),var(--gate2)); display:flex; align-items:center; justify-content:center; z-index:99;}
#gate .box{background:var(--card); padding:34px 36px; border-radius:16px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); width:min(92vw,360px);}
#gate h1{font-size:20px; margin-bottom:4px;}
#gate p{color:var(--sub); font-size:13px; margin-bottom:20px;}
#gate .modeBtn{display:block; width:100%; padding:13px; margin-bottom:10px; font-size:15px; font-weight:bold; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); cursor:pointer;}
#gate .modeBtn.view{background:var(--brand); color:#fff; border-color:var(--brand);}
#gate .modeBtn:hover{filter:brightness(1.05);}
#adminForm{display:none; margin-top:6px; text-align:left;}
#adminForm label{font-size:12px; color:var(--sub);}
#adminForm input{width:100%; padding:10px 12px; font-size:15px; border:2px solid var(--line); border-radius:9px; outline:none; margin:3px 0 10px; background:var(--card); color:var(--txt);}
#adminForm input:focus{border-color:var(--brand);}
#adminForm button{width:100%; padding:11px; font-size:15px; font-weight:bold; border:none; border-radius:9px; background:var(--brand); color:#fff; cursor:pointer;}
#gate .err{color:#ef4444; font-size:13px; height:18px; margin-top:8px;}
/* ===== 頂欄 ===== */
header{background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:sticky; top:0; z-index:20;}
header h1{font-size:17px; white-space:nowrap;}
#modeBadge{font-size:11.5px; padding:3px 9px; border-radius:10px; font-weight:bold; white-space:nowrap;}
#modeBadge.view{background:#e0f2fe; color:#0369a1;}
#modeBadge.admin{background:#dcfce7; color:#15803d;}
html[data-theme="dark"] #modeBadge.view{background:#173a52; color:#7dd3fc;}
html[data-theme="dark"] #modeBadge.admin{background:#14342a; color:#6ee7b7;}
header .spacer{flex:1;}
select,button{font-family:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--txt); padding:7px 12px; cursor:pointer;}
button:hover{background:var(--hoverBtn);}
button.primary{background:var(--brand); color:#fff; border-color:var(--brand);}
button.primary:hover{filter:brightness(1.1); background:var(--brand);}
#saveState{font-size:12px; color:var(--sub); min-width:64px; text-align:center;}
#saveState.saving{color:#d97706;}
#saveState.saved{color:#16a34a;}
#saveState.error{color:#ef4444; font-weight:bold;}
/* ===== 月份頁籤 ===== */
#monthTabs{display:flex; gap:4px; padding:8px 16px 0; flex-wrap:wrap;}
#monthTabs button{padding:6px 14px; border-radius:8px 8px 0 0; border-bottom:none; font-weight:bold; color:var(--sub);}
#monthTabs button.on{background:var(--brand); color:#fff; border-color:var(--brand);}
/* ===== 圖例 / 印章 ===== */
#legend{display:flex; gap:6px; padding:10px 16px; flex-wrap:wrap; align-items:center;}
#legend .hint{font-size:12px; color:var(--sub); margin-right:4px;}
.chip{padding:4px 10px; border-radius:14px; border:2px solid transparent; font-size:13px; cursor:pointer; user-select:none; font-weight:bold;}
body.viewonly .chip{cursor:default;}
.chip.on{border-color:var(--txt); box-shadow:0 2px 6px rgba(0,0,0,.25); transform:scale(1.08);}
/* ===== 表格 ===== */
#wrap{margin:0 16px 24px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:calc(100vh - 210px);}
table{border-collapse:separate; border-spacing:0; white-space:nowrap;}
th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; text-align:center; font-size:13px; background:var(--card);}
thead th{position:sticky; top:0; z-index:5; background:var(--head); font-size:12px; color:var(--sub);}
thead tr:nth-child(2) th{top:22px;}
thead th.dnum{min-width:34px; padding:3px 0; font-weight:bold; color:var(--txt);}
th.sticky1,td.sticky1{position:sticky; left:0; z-index:6; min-width:36px;}
th.sticky2,td.sticky2{position:sticky; left:36px; z-index:6; min-width:76px; text-align:left; padding:0 6px; font-weight:bold;}
th.sticky3,td.sticky3{position:sticky; left:112px; z-index:6; min-width:52px; box-shadow:2px 0 4px rgba(0,0,0,.06);}
thead th.sticky1,thead th.sticky2,thead th.sticky3{z-index:8;}
td.day{min-width:34px; height:30px; cursor:pointer; font-weight:bold;}
body.viewonly td.day{cursor:default;}
body:not(.viewonly) td.day:hover{outline:2px solid var(--brand); outline-offset:-2px;}
td.wknd{background:var(--wknd);}
td.today{background:var(--today);}
th.wkndH{background:var(--wkndH); color:var(--wkndHt);}
th.todayH{background:var(--today); color:var(--todayHt);}
td.stat{min-width:44px; font-weight:bold; background:var(--head);}
td.stat.leave{color:#dc2626;}
td.stat.off{color:var(--sub);}
td.stat.work{color:#16a34a;}
td.stat.ot{color:#d97706;}
html[data-theme="dark"] td.stat.leave{color:#f87171;}
html[data-theme="dark"] td.stat.work{color:#4ade80;}
html[data-theme="dark"] td.stat.ot{color:#fbbf24;}
tfoot td{position:sticky; bottom:0; background:var(--footbg); font-weight:bold; color:var(--brand); z-index:5; padding:4px 0;}
tr:hover td{background:var(--hover);}
tr:hover td.wknd{background:var(--wkndHover);}
tr:hover td.today{background:var(--todayHover);}
/* 代碼顏色（深色主題共用：淡底深字色塊） */
.c-1{color:#16a34a;}
.c-half{color:#0d9488;}
html[data-theme="dark"] .c-1{color:#4ade80;}
html[data-theme="dark"] .c-half{color:#2dd4bf;}
.c-休{background:#e2e8f0!important; color:#475569;}
.c-特{background:#dbeafe!important; color:#1d4ed8;}
.c-病{background:#ffedd5!important; color:#c2410c;}
.c-事{background:#fef9c3!important; color:#a16207;}
.c-婚{background:#fce7f3!important; color:#be185d;}
.c-喪{background:#e5e5e5!important; color:#404040;}
.c-公{background:#ccfbf1!important; color:#0f766e;}
.c-家{background:#fef3c7!important; color:#b45309;}
.c-生理{background:#fae8ff!important; color:#a21caf; font-size:11px!important;}
.c-教育{background:#e0f2fe!important; color:#0369a1; font-size:11px!important;}
.c-產{background:#fbcfe8!important; color:#9d174d;}
.c-陪產{background:#fbcfe8!important; color:#9d174d; font-size:11px!important;}
.c-產檢{background:#fbcfe8!important; color:#9d174d; font-size:11px!important;}
.c-職傷{background:#fee2e2!important; color:#b91c1c; font-size:11px!important;}
.c-職災{background:#fecaca!important; color:#991b1b; font-size:11px!important;}
.c-留停{background:#ede9fe!important; color:#6d28d9; font-size:11px!important;}
.c-X{color:#94a3b8; text-decoration:line-through;}
/* 理貨員：姓名淺藍底 */
td.sticky2.picker{background:#dbeafe!important; color:#1e40af;}
html[data-theme="dark"] td.sticky2.picker{background:#1e3a5f!important; color:#93c5fd;}
/* 遞交後修改：紅底(壓過假別色) */
td.day.late{background:#f87171!important; color:#7f1d1d!important; font-weight:bold;}
html[data-theme="dark"] td.day.late{background:#7f1d1d!important; color:#fecaca!important;}
#subInfo{font-size:12px; color:#16a34a; font-weight:bold;}
#diffBtn{background:#fee2e2; color:#b91c1c; border-color:#fca5a5; font-weight:bold;}
html[data-theme="dark"] #diffBtn{background:#450a0a; color:#fca5a5; border-color:#7f1d1d;}
/* ===== 底部提醒列 ===== */
#notesBar{margin:-12px 16px 24px; padding:8px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px;}
#notesBar .nlabel{color:var(--sub); font-size:12px; font-weight:bold;}
.note{padding:3px 12px; border-radius:8px; font-weight:bold; font-size:12.5px;}
.note-plain{background:transparent; color:var(--sub); border:1px dashed var(--line);}
.note-yellow{background:#fef9c3; color:#a16207;}
.note-red{background:#fca5a5; color:#7f1d1d;}
.note-blue{background:#dbeafe; color:#1d4ed8;}
.note-green{background:#dcfce7; color:#15803d;}
.note-gray{background:#e2e8f0; color:#475569;}
#notesModal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:60; padding:5vh 12px;}
#notesModal .panel{background:var(--card); border-radius:14px; width:min(96vw,520px); max-height:88vh; overflow:auto; padding:20px;}
#notesModal h2{font-size:17px; margin-bottom:12px;}
#notesRows .nrow{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
#notesRows input{flex:1; font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--card); color:var(--txt);}
#notesRows select{font-size:13px; padding:5px 6px;}
/* 異動清單 modal */
#diffModal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:60; padding:5vh 12px;}
#diffModal .panel{background:var(--card); border-radius:14px; width:min(96vw,560px); max-height:88vh; overflow:auto; padding:20px;}
#diffModal h2{font-size:17px; margin-bottom:4px;}
#diffModal .when{font-size:12px; color:var(--sub); margin-bottom:12px;}
#diffModal table{width:100%; border-collapse:collapse;}
#diffModal th,#diffModal td{padding:6px 8px; font-size:13px; border-bottom:1px solid var(--line); text-align:center;}
#diffModal .to{color:#dc2626; font-weight:bold;}
html[data-theme="dark"] #diffModal .to{color:#f87171;}
/* ===== 選碼面板 ===== */
#palette{position:absolute; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.3); padding:10px; display:none; z-index:50; width:230px;}
#palette .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
#palette .cell{padding:7px 2px; border-radius:8px; text-align:center; cursor:pointer; font-weight:bold; font-size:13px; border:1px solid var(--line);}
#palette .cell:hover{outline:2px solid var(--brand);}
#palette .who{font-size:12px; color:var(--sub); margin-bottom:6px; text-align:center;}
/* ===== 彙總 ===== */
#summary{margin:0 16px 24px; display:none;}
#summary .opts{margin-bottom:10px; display:flex; gap:14px; align-items:center; font-size:13px; color:var(--sub); flex-wrap:wrap;}
.sumcard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px;}
.sumcard .nm{font-weight:bold; font-size:15px; margin-bottom:6px;}
.sumcard .nm small{color:var(--sub); font-weight:normal; margin-left:8px;}
.sumline{display:flex; gap:8px; margin:3px 0; font-size:13.5px; align-items:baseline;}
.sumline .tag{padding:2px 10px; border-radius:10px; font-weight:bold; font-size:12.5px; white-space:nowrap;}
.sumempty{color:#16a34a; font-size:13.5px;}
#sumNone{background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:30px; text-align:center; color:var(--sub); display:none;}
/* ===== 統計 ===== */
#stats{margin:0 16px 24px; display:none;}
#stats .opts{margin-bottom:10px; display:flex; gap:14px; align-items:center; font-size:13px; color:var(--sub); flex-wrap:wrap;}
#statsWrap{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:calc(100vh - 240px);}
#statsGrid td, #statsGrid th{padding:5px 8px; min-width:44px;}
#statsGrid td.sticky2{min-width:76px;}
#statsGrid .neg{color:#dc2626; font-weight:bold;}
html[data-theme="dark"] #statsGrid .neg{color:#f87171;}
#statsGrid .quota input{width:54px; text-align:center; font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:3px 4px; background:var(--card); color:var(--txt);}
#statsGrid td.hl{font-weight:bold;}
#statsGrid tfoot td{background:var(--footbg); color:var(--brand); font-weight:bold; padding:6px 8px;}
.statNote{font-size:12px; color:var(--sub); margin-top:8px;}
/* ===== 名冊 ===== */
#roster{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:60; padding:5vh 12px;}
#roster .panel{background:var(--card); border-radius:14px; width:min(96vw,640px); max-height:90vh; overflow:auto; padding:20px;}
#roster h2{font-size:17px; margin-bottom:12px;}
#roster table{width:100%;}
#roster th,#roster td{padding:6px 8px; font-size:13px;}
#roster input{font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; width:100%; background:var(--card); color:var(--txt);}
#roster .inactive td{opacity:.45;}
.mini{padding:4px 9px; font-size:12px; border-radius:6px;}
body.viewonly .adminOnly{display:none!important;}
/* ===== 單位分組 ===== */
tr.unitRow td{background:var(--brand-light); color:var(--brand); font-weight:bold; text-align:left; padding:4px 8px; font-size:12.5px; border-bottom:2px solid var(--brand); position:sticky; left:0;}
html[data-theme="dark"] tr.unitRow td{background:#1c2a45;}
.unitTag{font-size:11px; padding:1px 7px; border-radius:8px; background:var(--brand-light); color:var(--brand); margin-left:6px; font-weight:normal; white-space:nowrap;}
/* ===== 列印選單 ===== */
#printMenu{position:absolute; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.25); padding:8px; display:none; z-index:70;}
#printMenu button{display:block; width:100%; margin:3px 0; white-space:nowrap;}
#printTitle{display:none;}
/* ===== 列印版面 ===== */
@media print{
  header,#monthTabs,#legend,#gate,#palette,#roster,#printMenu,#notesModal,#diffModal,#notesEditBtn,#summary .opts label,#stats .opts label,#stats .opts button{display:none!important;}
  #notesBar{border:none!important; margin:2mm 0 0!important; padding:0!important; page-break-inside:avoid;}
  .note{font-size:9px!important; padding:2px 8px!important;}
  #notesBar .nlabel{font-size:9px!important;}
  /* 深色主題列印時強制轉白底 */
  :root,html[data-theme="dark"]{
    --bg:#fff; --card:#fff; --line:#cbd5e1; --txt:#000; --sub:#475569;
    --brand:#1d4ed8; --brand-light:#eff6ff;
    --wknd:#fff7ed; --today:#fef9c3; --wkndH:#ffedd5; --wkndHt:#c2410c; --todayHt:#a16207;
    --head:#f1f5f9; --footbg:#eef2ff; --hover:#fff; --wkndHover:#fff7ed; --todayHover:#fef9c3;
  }
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  body{background:#fff;}
  #printTitle{display:block!important; text-align:center; font-size:15px; font-weight:bold; margin:0 0 2mm;}
  #printTitle small{font-weight:normal; font-size:10px; color:var(--sub); margin-left:8px;}
  #wrap,#statsWrap{max-height:none!important; overflow:visible!important; margin:0!important; border:none!important; border-radius:0!important;}
  #summary,#stats{margin:0!important;}
  table{width:100%;}
  th,td{font-size:8.5px!important; padding:0!important;}
  thead th,th.sticky1,td.sticky1,th.sticky2,td.sticky2,th.sticky3,td.sticky3,tfoot td{position:static!important; box-shadow:none!important;}
  th.sticky1,td.sticky1{min-width:14px!important; display:table-cell!important;}
  th.sticky2,td.sticky2{min-width:44px!important; display:table-cell!important; padding:0 2px!important;}
  th.sticky3,td.sticky3{min-width:26px!important; display:table-cell!important;}
  td.day,thead th.dnum{min-width:20px!important; height:15px!important;}
  td.stat{min-width:24px!important;}
  tr.unitRow td{padding:3px 6px!important; font-size:10px!important; background:#1d4ed8!important; color:#fff!important; border-bottom:none!important;}
  tbody tr{page-break-inside:avoid;}
  .sumcard{page-break-inside:avoid; border-color:#cbd5e1;}
  td.day:hover{outline:none!important;}
}
/* ===== 手機版 ===== */
@media (max-width:640px){
  body{font-size:13px; -webkit-tap-highlight-color:transparent;}
  header{padding:8px 10px; gap:6px;}
  header h1{font-size:15px; flex:1;}
  header .spacer{display:none;}
  #saveState{min-width:auto; font-size:11px; order:1;}
  #yearSel,#unitSel{padding:5px 6px; font-size:12px;}
  header button{padding:6px 9px; font-size:12.5px; border-radius:7px; flex:1; white-space:nowrap;}
  #themeBtn,#logoutBtn,#printBtn{flex:0 0 auto;}
  #viewBtn,#rosterBtn,#expMonth,#expYear{order:2;}
  #monthTabs{flex-wrap:nowrap; overflow-x:auto; padding:8px 10px 0; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  #monthTabs::-webkit-scrollbar{display:none;}
  #monthTabs button{padding:6px 12px; border-radius:8px; border:1px solid var(--line); flex:0 0 auto;}
  #legend{flex-wrap:nowrap; overflow-x:auto; padding:8px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  #legend::-webkit-scrollbar{display:none;}
  #legend .hint{display:none;}
  .chip{flex:0 0 auto; font-size:12px; padding:5px 10px;}
  #fillBtn,#submitBtn,#diffBtn{flex:0 0 auto; font-size:12px;}
  #subInfo{flex:0 0 auto; white-space:nowrap;}
  #wrap{margin:0 8px 16px; max-height:calc(100vh - 176px); border-radius:8px;}
  th.sticky1,td.sticky1,th.sticky3,td.sticky3{display:none;}
  th.sticky2,td.sticky2{left:0; min-width:66px; font-size:12.5px; padding:0 4px; box-shadow:2px 0 4px rgba(0,0,0,.06);}
  td.day{min-width:32px; height:34px;}
  thead th.dnum{min-width:32px;}
  td.stat{min-width:38px; font-size:12px;}
  #palette{position:fixed; left:0!important; right:0; bottom:0; top:auto!important; width:100%; border-radius:18px 18px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.4);}
  #palette .grid{grid-template-columns:repeat(4,1fr); gap:8px;}
  #palette .cell{padding:12px 2px; font-size:14px; border-radius:10px;}
  #palette .who{font-size:14px; font-weight:bold; color:var(--txt); margin-bottom:10px;}
  #summary{margin:0 8px 16px;}
  .sumcard{padding:10px 12px;}
  #notesBar{margin:-8px 8px 16px; font-size:12px;}
  #stats{margin:0 8px 16px;}
  #statsWrap{max-height:calc(100vh - 210px);}
  #statsGrid td,#statsGrid th{padding:4px 5px; min-width:38px; font-size:12px;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>📅 彰化轉運中心 出勤表</h1>
    <p>請選擇登入方式</p>
    <button class="modeBtn view" id="viewEnter">👁 檢視模式（只能看）</button>
    <button class="modeBtn" id="adminToggle">🔑 管理員登入（可修改）</button>
    <div id="adminForm">
      <label>帳號</label>
      <input id="adminUser" inputmode="numeric" placeholder="工號" autocomplete="username">
      <label>密碼</label>
      <input id="adminPass" type="password" placeholder="密碼" autocomplete="current-password">
      <button id="adminLogin">登入</button>
    </div>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<header>
  <h1>📅 彰化轉運中心出勤表</h1>
  <span id="modeBadge"></span>
  <select id="yearSel"></select>
  <select id="unitSel">

<script>
"use strict";
/* ================= 設定 ================= */
const SB_URL = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/rest/v1";
const FN_URL = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/att";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtcW5sb3Z5emx2dm5rcW1md3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjgxMTAsImV4cCI6MjEwMDU0NDExMH0.epqZ-DZsthezuTjfFGEhosR3hU3v8FgR4w0xnYOHN6s";
const H = {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
const CODES = ["1","0.5","休","特","病","事","家","公","婚","喪","生理","教育","產","陪產","產檢","職傷","職災","留停","X",""];
const CODE_LABEL = {"1":"上班","0.5":"半天","休":"排休","特":"特休","病":"病假","事":"事假","家":"家庭","公":"公假","婚":"婚假","喪":"喪假","生理":"生理","教育":"教育","產":"產假","陪產":"陪產","產檢":"產檢","職傷":"職傷","職災":"職災","留停":"留停","X":"X","":"清空"};
const LEAVE_SET = new Set(["特","事","家","病","生理","公","教育","職災","職傷","產","陪產","產檢","婚","喪"]);
const WD = ["日","一","二","三","四","五","六"];
const UNITS = ["發送","到著","冷鏈","籠車"];
const UNIT_LABEL = {"發送":"彰化發送單位","到著":"彰化到著單位","冷鏈":"彰化冷鏈(低溫)單位","籠車":"彰化籠車單位","":"未分類"};

/* ================= 狀態 ================= */
let employees = [];
let records = {};
let yy = 115, mm = (new Date().getMonth()+1);
let unitFilter = "all";
let notes = [];
let stamp = null, palTarget = null;
const dirty = new Set(); let saveTimer = null;
let isAdmin = false, adminToken = "";

const $ = id => document.getElementById(id);
const key = (e,m) => `${e}_${yy}_${m}`;
const daysInMonth = (y,m) => new Date(y+1911, m, 0).getDate();
const wday = (y,m,d) => new Date(y+1911, m-1, d).getDay();
function getRec(emp_no, m){
  const k = key(emp_no, m);
  if(!records[k]) records[k] = {days:Array(31).fill(""), overtime:0};
  return records[k];
}
function visibleGroups(){
  const actives = employees.filter(e=>e.active && (unitFilter==="all" || (e.unit||"")===unitFilter));
  const groups = [];
  for(const u of [...UNITS, ""]){
    const list = actives.filter(e=>(e.unit||"")===u);
    if(list.length) groups.push({unit:u, list});
  }
  return {actives, groups};
}

  localStorage.setItem("att_theme", t);

}
applyTheme(localStorage.getItem("att_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"));

/* ================= 登入 ================= */
function enter(mode, token){
  isAdmin = (mode==="admin");
  adminToken = token || "";
  sessionStorage.setItem("att_mode", mode);

  $("legendHint").textContent = isAdmin ? "點格子選代碼；或先點下方「印章」再連續點格子快速填：" : "代碼圖例：";
  loadAll();
}

async function doLogin(){
  $("gateErr").textContent = "驗證中…";
  try{
    const res = await fetch(FN_URL, {method:"POST", headers:H, body:JSON.stringify({action:"login", user:$("adminUser").value, pass:$("adminPass").value})});

  }catch{ $("gateErr").textContent = "連線失敗，請重試"; }
}

  sessionStorage.removeItem("att_mode"); sessionStorage.removeItem("att_token");
  location.reload();
};
// 自動恢復上次登入（同分頁）
{
  const m = sessionStorage.getItem("att_mode");
  if(m==="admin" && sessionStorage.getItem("att_token")) enter("admin", sessionStorage.getItem("att_token"));
  else if(m==="view") enter("view");
}

/* ================= 資料載入 ================= */
async function loadAll(){
  setSave("載入中…","saving");
  const [eRes, rRes, nRes] = await Promise.all([
    fetch(`${SB_URL}/att_employees?select=*&order=seq,emp_no`, {headers:H}),
    fetch(`${SB_URL}/att_records?select=emp_no,yy,mm,days,overtime,submitted_days,submitted_at&yy=eq.${yy}`, {headers:H}),
    fetch(`${SB_URL}/att_settings?key=eq.footer_notes&select=value`, {headers:H})
  ]);
  employees = await eRes.json();
  try{ const nRows = await nRes.json(); notes = Array.isArray(nRows[0]?.value) ? nRows[0].value : []; }catch{ notes = []; }
  records = {};
  (await rRes.json()).forEach(r=>{
    const days = Array.isArray(r.days)? r.days.slice(0,31) : [];
    while(days.length<31) days.push("");
    let sub = null;
    if(Array.isArray(r.submitted_days)){
      sub = r.submitted_days.slice(0,31);
      while(sub.length<31) sub.push("");
    }
    records[`${r.emp_no}_${r.yy}_${r.mm}`] = {days, overtime:+r.overtime||0, submitted_days:sub, submitted_at:r.submitted_at||null};
  });
  setSave("✓ 已載入","saved");
  render();
}

/* ================= 儲存（走 Edge Function） ================= */
function markDirty(emp_no, m){
  dirty.add(`${emp_no}|${m}`);
  setSave("● 未儲存…","saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if(!isAdmin) return;
  const batch = [...dirty]; dirty.clear();
  if(!batch.length) return;
  const rows = batch.map(k=>{
    const [e,m] = k.split("|");
    const r = getRec(e,+m);
    return {emp_no:e, yy, mm:+m, days:r.days, overtime:r.overtime};
  });
  try{
    const res = await fetch(FN_URL, {method:"POST", headers:H, body:JSON.stringify({action:"upsert_records", token:adminToken, rows})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    setSave("✓ 已儲存","saved");
  }catch(err){
    batch.forEach(b=>dirty.add(b));
    setSave("✗ 儲存失敗! 檢查網路","error");
  }
}
function setSave(t,c){ const s=$("saveState"); s.textContent=t; s.className="adminOnly "+c; }
window.addEventListener("beforeunload", e=>{ if(dirty.size){ flush(); e.preventDefault(); } });

/* ================= 統計 ================= */
function calcStats(rec, dim){
  let work=0, leave=0, off=0;
  for(let i=0;i<dim;i++){
    const v = rec.days[i];
    if(v==="" ) continue;
    const num = parseFloat(v);
    if(!isNaN(num)) work += num;
    else if(v==="休") off++;
    else if(LEAVE_SET.has(v)) leave++;
  }
  const ot = work>22 ? +(work-22).toFixed(1) : 0;
  return {work:+work.toFixed(1), leave, off, ot};
}

/* ================= 主表 ================= */
let view = "grid";
function setView(v){
  view = v;
  $("wrap").style.display    = v==="grid" ? "block" : "none";
  $("notesBar").style.display = v==="grid" ? "flex" : "none";
  $("summary").style.display = v==="sum"  ? "block" : "none";
  $("stats").style.display   = v==="stats"? "block" : "none";
  $("monthTabs").style.display = v==="stats" ? "none" : "flex";
  $("legend").style.display    = v==="stats" ? "none" : "flex";
  $("viewBtn").textContent  = v==="sum"   ? "📅 格子檢視" : "📋 彙總檢視";
  $("statsBtn").textContent = v==="stats" ? "📅 格子檢視" : "📊 統計";
  render();
}
function render(){
  renderTabs(); renderLegend();
  if(view==="sum") renderSummary();
  else if(view==="stats") renderStats();
  else renderGrid();
}
function renderTabs(){
  $("monthTabs").innerHTML = Array.from({length:12},(_,i)=>
    `<button class="${i+1===mm?'on':''}" onclick="switchMonth(${i+1})">${i+1}月</button>`).join("");
}
window.switchMonth = m => { mm=m; render(); };

function renderLegend(){
  const el = $("legend");
  el.querySelectorAll(".chip").forEach(c=>c.remove());
  CODES.filter(c=>c!=="").forEach(c=>{
    const s = document.createElement("span");
    s.className = "chip c-"+cssCode(c) + (stamp===c?" on":"");
    s.textContent = c + (CODE_LABEL[c]&&CODE_LABEL[c]!==c?` ${CODE_LABEL[c]}`:"");
    if(isAdmin) s.onclick = ()=>{ stamp = (stamp===c? null : c); renderLegend(); };
    el.appendChild(s);
  });
  if(isAdmin){
    const s = document.createElement("span");
    s.className = "chip" + (stamp===""?" on":"");
    s.style.border = stamp===""?"2px solid var(--txt)":"2px dashed var(--line)";
    s.textContent = "⌫ 清空";
    s.onclick = ()=>{ stamp = (stamp===""? null : ""); renderLegend(); };
    el.appendChild(s);
  }
}
function cssCode(c){ return c==="1"?"1": c==="0.5"?"half": c; }

function renderGrid(){
  const dim = daysInMonth(yy,mm);
  const today = new Date();
  const isThisMonth = (today.getFullYear()===yy+1911 && today.getMonth()+1===mm);
  const td = isThisMonth? today.getDate() : -1;
  let h1 = `<tr><th class="sticky1">序</th><th class="sticky2">姓名</th><th class="sticky3">工號</th>`;
  let h2 = `<tr><th class="sticky1"></th><th class="sticky2"></th><th class="sticky3"></th>`;
  for(let d=1;d<=dim;d++){
    const w = wday(yy,mm,d);
    const cls = (d===td?"todayH": (w===0||w===6)?"wkndH":"");
    h1 += `<th class="dnum ${cls}">${d}</th>`;
    h2 += `<th class="${cls}">${WD[w]}</th>`;
  }
  h1 += `<th>上班</th><th>請假</th><th>排休</th><th>加班</th></tr>`;
  h2 += `<th colspan="4" style="font-size:10px">天數統計</th></tr>`;

  let body = "";
  const {actives, groups} = visibleGroups();
  const totalCols = 3 + dim + 4;
  for(const g of groups){
    if(unitFilter==="all" && groups.length>1)
      body += `<tr class="unitRow"><td colspan="${totalCols}">▍${UNIT_LABEL[g.unit]}（${g.list.length}人）</td></tr>`;
    for(const e of g.list){
      const rec = getRec(e.emp_no, mm);
      const st = calcStats(rec, dim);
      body += `<tr><td class="sticky1" style="color:var(--sub)">${e.seq===999?"":e.seq}</td>
        <td class="sticky2${e.is_picker?" picker":""}" title="到職 ${e.hire_date}｜${UNIT_LABEL[e.unit||""]}${e.is_picker?"｜理貨員(無餐費)":""}">${e.name}</td>
        <td class="sticky3" style="color:var(--sub);font-size:12px">${e.emp_no}</td>`;
      for(let d=1;d<=dim;d++){
        const v = rec.days[d-1];
        const w = wday(yy,mm,d);
        const late = rec.submitted_days && v!==rec.submitted_days[d-1];
        const cls = ["day", v?("c-"+cssCode(v)):"", d===td?"today":(w===0||w===6)?"wknd":"", late?"late":""].join(" ");
        body += `<td class="${cls}" data-e="${e.emp_no}" data-d="${d}" ${late?`title="遞交時：${rec.submitted_days[d-1]||"空"}"`:""}>${v}</td>`;
      }
      body += `<td class="stat work">${st.work||""}</td><td class="stat leave">${st.leave||""}</td>
               <td class="stat off">${st.off||""}</td><td class="stat ot">${st.ot||""}</td></tr>`;
    }
  }
  let foot = `<tr><td class="sticky1"></td><td class="sticky2">當日上班人數</td><td class="sticky3"></td>`;
  for(let d=1;d<=dim;d++){
    let n=0;
    for(const e of actives){ const v=getRec(e.emp_no,mm).days[d-1]; const f=parseFloat(v); if(!isNaN(f)&&f>0) n++; }
    foot += `<td>${n||""}</td>`;
  }
  foot += `<td colspan="4"></td></tr>`;
  $("grid").innerHTML = `<thead>${h1}${h2}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot>`;

  if(isAdmin){
    $("grid").querySelectorAll("td.day").forEach(cell=>{
      cell.onclick = ev => onCell(cell, ev);
      cell.oncontextmenu = ev => { ev.preventDefault(); setCell(cell.dataset.e, +cell.dataset.d, ""); };
    });
  }
  updateSubmitUI();
  renderNotes();
}

/* ================= 底部提醒列 ================= */
function renderNotes(){
  $("notesList").innerHTML = notes.map(n=>`<span class="note note-${n.color}">${n.text}</span>`).join(" ");
}
$("notesEditBtn").onclick = ()=>{
  if(!isAdmin) return;
  $("notesRows").innerHTML = "";
  (notes.length?notes:[{text:"",color:"plain"}]).forEach(n=>addNoteRow(n.text, n.color));

function addNoteRow(text, color){
  const div = document.createElement("div");
  div.className = "nrow";

    <select>${[["plain","無底色"],["yellow","黃底"],["red","紅底"],["blue","藍底"],["green","綠底"],["gray","灰底"]].map(([v,l])=>`<option value="${v}" ${v===color?"selected":""}>${l}</option>`).join("")}</select>
    <button class="mini" onclick="this.parentElement.remove()">🗑</button>`;
  $("notesRows").appendChild(div);
}
$("noteAdd").onclick = ()=> addNoteRow("", "plain");
$("noteSave").onclick = async ()=>{
  const newNotes = [...$("notesRows").querySelectorAll(".nrow")].map(r=>({
    text: r.querySelector("input").value.trim(),
    color: r.querySelector("select").value
  })).filter(n=>n.text);
  const j = await fnCall({action:"set_notes", notes:newNotes});
  if(!j.ok){ alert("儲存失敗："+(j.error||"")); return; }
  notes = j.notes;
  $("notesModal").style.display = "none";
  renderNotes();
};

/* ================= 遞交存檔 / 異動 ================= */
function monthSubmittedAt(m){
  for(const e of employees.filter(x=>x.active)){
    const rec = records[`${e.emp_no}_${yy}_${m}`];
    if(rec && rec.submitted_at) return rec.submitted_at;
  }
  return null;
}
function monthDiffs(m){
  const out = [];
  for(const e of employees.filter(x=>x.active)){
    const rec = records[`${e.emp_no}_${yy}_${m}`];
    if(!rec || !rec.submitted_days) continue;
    const dim = daysInMonth(yy,m);
    for(let d=1;d<=dim;d++){
      const a = rec.submitted_days[d-1]||"", b = rec.days[d-1]||"";
      if(a!==b) out.push({name:e.name, emp_no:e.emp_no, day:d, from:a, to:b});
    }
  }
  return out;
}
function fmtSubDate(iso){
  const t = new Date(iso);
  return `${t.getFullYear()-1911}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
}
function updateSubmitUI(){
  const at = monthSubmittedAt(mm);
  $("subInfo").textContent = at ? `✓ 本月已於 ${fmtSubDate(at)} 遞交` : "";
  const diffs = at ? monthDiffs(mm) : [];
  $("diffBtn").style.display = diffs.length ? "inline-block" : "none";
  $("diffBtn").textContent = `🔴 異動清單(${diffs.length})`;
}
$("submitBtn").onclick = async ()=>{
  if(!isAdmin) return;
  const at = monthSubmittedAt(mm);
  const msg = at
    ? `${yy}年${mm}月已於 ${fmtSubDate(at)} 遞交過。\n要以「現在的內容」重新存檔嗎？（紅底標示會歸零重算）`
    : `將 ${yy}年${mm}月 現況存檔為遞交版本？\n之後的修改會以紅底標示。`;
  if(!confirm(msg)) return;
  if(dirty.size) await flush();
  const j = await fnCall({action:"snapshot_month", yy, mm});
  if(!j.ok){ alert("遞交存檔失敗："+(j.error||"")); return; }
  for(const k of Object.keys(records)){
    const [,ky,km] = k.match(/^(?:.*)_(\d+)_(\d+)$/)||[];
    if(+ky===yy && +km===mm){ records[k].submitted_days = records[k].days.slice(); records[k].submitted_at = j.submitted_at; }
  }
  renderGrid();
  alert(`已遞交存檔（${j.count} 筆）。`);
};

function onCell(cell, ev){
  const e = cell.dataset.e, d = +cell.dataset.d;
  if(stamp!==null){ setCell(e,d,stamp); return; }
  palTarget = {e,d};
  const emp = employees.find(x=>x.emp_no===e);
  $("palWho").textContent = `${emp?emp.name:e} — ${mm}/${d}`;
  $("palGrid").innerHTML = CODES.map(c=>
    `<div class="cell c-${cssCode(c)}" data-c="${c}" style="${c===""?"border:1px dashed var(--line)":""}">${c===""?"⌫":c}</div>`).join("");
  $("palGrid").querySelectorAll(".cell").forEach(x=> x.onclick = ()=>{ setCell(palTarget.e, palTarget.d, x.dataset.c); hidePal(); });
  const pal = $("palette");
  pal.style.display="block";
  const r = cell.getBoundingClientRect();
  let x = r.left + window.scrollX - 90, y = r.bottom + window.scrollY + 6;
  x = Math.max(8, Math.min(x, window.innerWidth-246));
  if(r.bottom + 230 > window.innerHeight) y = r.top + window.scrollY - 236;
  pal.style.left = x+"px"; pal.style.top = y+"px";
  ev.stopPropagation();
}
function hidePal(){ $("palette").style.display="none"; palTarget=null; }
document.addEventListener("click", e=>{ if(!$("palette").contains(e.target)) hidePal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ hidePal(); stamp=null; renderLegend(); } });

function fmtRanges(list){
  const out=[]; let s=null,p=null;
  for(const d of list){
    if(s===null){ s=p=d; continue; }
    if(d===p+1){ p=d; continue; }
    out.push(s===p? `${mm}/${s}` : `${mm}/${s}~${mm}/${p}`); s=p=d;
  }
  if(s!==null) out.push(s===p? `${mm}/${s}` : `${mm}/${s}~${mm}/${p}`);
  return out.join("、");
}
function renderSummary(){
  const dim = daysInMonth(yy,mm);
  const withRest = $("sumRest").checked, onlyNZ = $("sumOnly").checked;
  let html = "", shown=0;
  const {groups} = visibleGroups();
  for(const g of groups){
    let unitHtml = "", unitShown = 0;
    for(const e of g.list){
      const rec = getRec(e.emp_no, mm);
      const byCode = {};
      for(let d=1;d<=dim;d++){
        const v = rec.days[d-1];
        if(v==="" ) continue;
        if(!isNaN(parseFloat(v))) continue;
        if(v==="休" && !withRest) continue;
        (byCode[v] = byCode[v]||[]).push(d);
      }
      const codes = Object.keys(byCode);
      const st = calcStats(rec, dim);
      if(onlyNZ && !codes.length) continue;
      unitShown++; shown++;
      unitHtml += `<div class="sumcard"><div class="nm">${e.name}<span class="unitTag">${UNIT_LABEL[e.unit||""]}</span><small>工號 ${e.emp_no}｜上班 ${st.work}｜請假 ${st.leave}｜排休 ${st.off}${st.ot?`｜加班 ${st.ot}`:""}</small></div>`;
      if(!codes.length) unitHtml += `<div class="sumempty">無勤缺紀錄</div>`;
      for(const c of codes){
        unitHtml += `<div class="sumline"><span class="tag c-${cssCode(c)}">${c} ${CODE_LABEL[c]||""}</span><span>${fmtRanges(byCode[c])}</span><span style="color:var(--sub)">共 ${byCode[c].length} 天</span></div>`;
      }
      unitHtml += `</div>`;
    }
    if(unitShown) html += `<div style="font-weight:bold;color:var(--brand);margin:12px 0 6px">▍${UNIT_LABEL[g.unit]}</div>` + unitHtml;
  }
  $("sumList").innerHTML = html;
  $("sumNone").style.display = shown? "none":"block";
}

/* ================= 年度請假統計 ================= */
const LEAVE_COLS = ["特","病","事","家","公","婚","喪","生理","教育","產","陪產","產檢","職傷","職災"];
function leaveTally(){
  // 回傳 {emp_no: {code:天數, _留停:天數}}，範圍=全年累計至今(或含未來)
  const now = new Date();
  const curY = now.getFullYear()-1911, curM = now.getMonth()+1, curD = now.getDate();
  const incFuture = $("statFuture").checked;
  const tally = {};
  for(const e of employees){
    const t = {};
    for(let m=1;m<=12;m++){
      const rec = records[`${e.emp_no}_${yy}_${m}`];
      if(!rec) continue;
      const dim = daysInMonth(yy,m);
      let last = dim;
      if(!incFuture && yy===curY){
        if(m>curM) last = 0;
        else if(m===curM) last = curD;
      }
      if(!incFuture && yy>curY) last = 0;
      for(let d=1;d<=last;d++){
        const v = rec.days[d-1];
        if(LEAVE_SET.has(v) || v==="留停") t[v]=(t[v]||0)+1;
      }
    }
    tally[e.emp_no]=t;
  }
  return tally;
}
function statCols(tally, list){
  // 有人請過的假別才顯示欄位；特休恆顯示
  const used = new Set(["特"]);
  for(const e of list) for(const c of Object.keys(tally[e.emp_no]||{})) if(c!=="留停") used.add(c);
  return LEAVE_COLS.filter(c=>used.has(c));
}
function renderStats(){
  const now = new Date();
  const curY = now.getFullYear()-1911;
  $("statScope").textContent = `（民國${yy}年 1/1 ~ ${$("statFuture").checked||yy!==curY ? "12/31" : `${now.getMonth()+1}/${now.getDate()}`}）`;
  const tally = leaveTally();
  const {groups} = visibleGroups();
  const all = groups.flatMap(g=>g.list);
  const cols = statCols(tally, all);
  const showLT = all.some(e=>(tally[e.emp_no]||{})["留停"]);
  const nCols = 3+3+cols.length-1+1+(showLT?1:0); // 序姓名工號+額度已請剩餘+其餘假別+合計(+留停)

  let h = `<thead><tr><th class="sticky1">序</th><th class="sticky2">姓名</th><th class="sticky3">工號</th>
    <th>特休額度</th><th>已請特休</th><th>剩餘特休</th>`;
  for(const c of cols) if(c!=="特") h += `<th>${CODE_LABEL[c]||c}</th>`;
  h += `<th>請假合計</th>`;
  if(showLT) h += `<th>留停</th>`;
  h += `</tr></thead>`;

  const tot = {}; let totQ=0, totUsed=0, totSum=0, totLT=0;
  let body = "";
  for(const g of groups){
    if(unitFilter==="all" && groups.length>1)
      body += `<tr class="unitRow"><td colspan="${nCols}">▍${UNIT_LABEL[g.unit]}（${g.list.length}人）</td></tr>`;
    for(const e of g.list){
      const t = tally[e.emp_no]||{};
      const q = +e.annual_quota||0, used = t["特"]||0, left = +(q-used).toFixed(1);
      let sum = 0; for(const c of LEAVE_COLS) sum += t[c]||0;
      totQ+=q; totUsed+=used; totSum+=sum; totLT+=t["留停"]||0;
      for(const c of cols) tot[c]=(tot[c]||0)+(t[c]||0);
      const qCell = isAdmin
        ? `<td class="quota"><input type="number" min="0" step="0.5" value="${q||""}" placeholder="0" onchange="setQuota(${e.id},this.value)"></td>`
        : `<td>${q||""}</td>`;
      body += `<tr><td class="sticky1" style="color:var(--sub)">${e.seq===999?"":e.seq}</td>
        <td class="sticky2${e.is_picker?" picker":""}" ${e.is_picker?'title="理貨員(無餐費)"':""}>${e.name}</td>
        <td class="sticky3" style="color:var(--sub);font-size:12px">${e.emp_no}</td>
        ${qCell}<td>${used||""}</td><td class="${left<0?"neg":""}">${q?left:""}</td>`;
      for(const c of cols) if(c!=="特") body += `<td>${t[c]||""}</td>`;
      body += `<td class="hl">${sum||""}</td>`;
      if(showLT) body += `<td>${t["留停"]||""}</td>`;
      body += `</tr>`;
    }
  }
  let foot = `<tfoot><tr><td class="sticky1"></td><td class="sticky2">合計</td><td class="sticky3"></td>
    <td>${totQ||""}</td><td>${totUsed||""}</td><td></td>`;
  for(const c of cols) if(c!=="特") foot += `<td>${tot[c]||""}</td>`;
  foot += `<td>${totSum||""}</td>`;
  if(showLT) foot += `<td>${totLT||""}</td>`;
  foot += `</tr></tfoot>`;
  $("statsGrid").innerHTML = h + `<tbody>${body}</tbody>` + foot;
}
window.setQuota = async (id, v)=>{
  if(!isAdmin) return;
  const j = await fnCall({action:"patch_employee", id, fields:{annual_quota:+v||0}});
  if(!j.ok){ alert("額度儲存失敗："+(j.error||"")); return; }
  const e = employees.find(x=>x.id===id); if(e) e.annual_quota=+v||0;
  renderStats();
};
$("expStats").onclick = ()=>{
  const tally = leaveTally();
  const {groups} = visibleGroups();
  const all = groups.flatMap(g=>g.list);
  const cols = statCols(tally, all);
  const showLT = all.some(e=>(tally[e.emp_no]||{})["留停"]);
  const rows = [];
  rows.push([`彰化轉運中心 ${yy}年 請假統計 ${$("statScope").textContent}`]);
  const hd = ["序","姓名","工號","特休額度","已請特休","剩餘特休"];
  for(const c of cols) if(c!=="特") hd.push(CODE_LABEL[c]||c);
  hd.push("請假合計"); if(showLT) hd.push("留停");
  rows.push(hd);
  for(const g of groups){
    if(groups.length>1) rows.push([`▍${UNIT_LABEL[g.unit]}（${g.list.length}人）`]);
    for(const e of g.list){
      const t = tally[e.emp_no]||{};
      const q = +e.annual_quota||0, used = t["特"]||0;
      let sum=0; for(const c of LEAVE_COLS) sum += t[c]||0;
      const row = [e.seq===999?"":e.seq, e.name, e.emp_no, q||"", used||"", q?+(q-used).toFixed(1):""];
      for(const c of cols) if(c!=="特") row.push(t[c]||"");
      row.push(sum||""); if(showLT) row.push(t["留停"]||"");
      rows.push(row);
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const lastCol = rows[1].length-1;
  ws["!cols"] = [{wch:4},{wch:9},{wch:7}, ...Array(lastCol-2).fill({wch:8})];
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const center = {horizontal:"center", vertical:"center"};
  const border = {top:{style:"thin",color:{rgb:"CBD5E1"}},bottom:{style:"thin",color:{rgb:"CBD5E1"}},left:{style:"thin",color:{rgb:"CBD5E1"}},right:{style:"thin",color:{rgb:"CBD5E1"}}};
  for(let R=range.s.r; R<=range.e.r; R++){
    const aCell = ws[XLSX.utils.encode_cell({r:R,c:0})];
    const isUnitRow = aCell && typeof aCell.v==="string" && aCell.v.startsWith("▍");
    if(isUnitRow) ws["!merges"].push({s:{r:R,c:0}, e:{r:R,c:lastCol}});
    for(let C=range.s.c; C<=range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(!cell) continue;
      if(R===0) cell.s = {alignment:center, font:{name:"微軟正黑體", sz:14, bold:true}};
      else if(isUnitRow) cell.s = {alignment:{horizontal:"left", vertical:"center"}, font:{name:"微軟正黑體", sz:11, bold:true, color:{rgb:"FFFFFF"}}, fill:{patternType:"solid", fgColor:{rgb:"1D4ED8"}}, border};
      else if(R===1) cell.s = {alignment:center, font:{name:"微軟正黑體", sz:10, bold:true}, fill:{patternType:"solid", fgColor:{rgb:"F1F5F9"}}, border};
      else cell.s = {alignment:center, font:{name:"微軟正黑體", sz:10}, border};
    }
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${yy}年請假統計`);
  XLSX.writeFile(wb, `彰化轉運中心${yy}年請假統計.xlsx`);
};

const CODE_XLSX = {
  "休":["E2E8F0","475569"],"特":["DBEAFE","1D4ED8"],"病":["FFEDD5","C2410C"],"事":["FEF9C3","A16207"],
  "婚":["FCE7F3","BE185D"],"喪":["E5E5E5","404040"],"公":["CCFBF1","0F766E"],"家":["FEF3C7","B45309"],
  "生理":["FAE8FF","A21CAF"],"教育":["E0F2FE","0369A1"],"產":["FBCFE8","9D174D"],"陪產":["FBCFE8","9D174D"],
  "產檢":["FBCFE8","9D174D"],"職傷":["FEE2E2","B91C1C"],"職災":["FECACA","991B1B"],"留停":["EDE9FE","6D28D9"]
};
function monthAOA(m){
  const dim = daysInMonth(yy,m);
  const rows = [];
  const lateSet = new Set();   // "R:C" 遞交後修改的格子
  const pickerRows = new Set(); // 理貨員所在列(姓名淺藍底)
  rows.push([`新竹物流彰化轉運中心${yy}.${String(m).padStart(2,"0")}勤怠表`]);
  const hd = ["序","姓名","工號","到職日"];
  const wd2 = ["","","",""];
  for(let d=1;d<=dim;d++){ hd.push(d); wd2.push(WD[wday(yy,m,d)]); }
  hd.push("上班天數","請假天數","排休天數","加班天數");
  rows.push(hd); rows.push(wd2);
  const {groups} = visibleGroups();
  for(const g of groups){
    if(groups.length>1) rows.push([`▍${UNIT_LABEL[g.unit]}（${g.list.length}人）`]);
    for(const e of g.list){
      const rec = records[key(e.emp_no,m)] || {days:Array(31).fill(""),overtime:0};
      const st = calcStats(rec, dim);
      const row = [e.seq===999?"":e.seq, e.name, e.emp_no, e.hire_date];
      const R = rows.length;
      if(e.is_picker) pickerRows.add(R);
      for(let d=1;d<=dim;d++){
        const v = rec.days[d-1];
        const f = parseFloat(v);
        row.push(v===""? "" : (!isNaN(f)? f : v));
        if(rec.submitted_days && v!==rec.submitted_days[d-1]) lateSet.add(`${R}:${3+d}`);
      }
      row.push(st.work, st.leave, st.off, st.ot);
      rows.push(row);
    }
  }
  // 底部提醒列
  const noteRows = new Map();  // R -> color
  if(notes.length){
    rows.push([]);
    for(const n of notes){ noteRows.set(rows.length, n.color); rows.push([n.text]); }
  }
  return {rows, lateSet, noteRows, pickerRows};
}
const NOTE_XLSX = {plain:[null,"64748B"], yellow:["FEF9C3","A16207"], red:["FCA5A5","7F1D1D"], blue:["DBEAFE","1D4ED8"], green:["DCFCE7","15803D"], gray:["E2E8F0","475569"]};
function styleSheet(ws, m, lateSet, noteRows, pickerRows){
  const dim = daysInMonth(yy,m);
  const lastCol = 4+dim+3;
  ws["!cols"] = [{wch:4},{wch:9},{wch:7},{wch:9}, ...Array(dim).fill({wch:3.5}), {wch:9},{wch:9},{wch:9},{wch:9}];
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const center = {horizontal:"center", vertical:"center"};
  const F = "微軟正黑體";
  const border = {top:{style:"thin",color:{rgb:"CBD5E1"}},bottom:{style:"thin",color:{rgb:"CBD5E1"}},left:{style:"thin",color:{rgb:"CBD5E1"}},right:{style:"thin",color:{rgb:"CBD5E1"}}};
  for(let R=range.s.r; R<=range.e.r; R++){
    const aCell = ws[XLSX.utils.encode_cell({r:R,c:0})];
    const isUnitRow = aCell && typeof aCell.v==="string" && aCell.v.startsWith("▍");
    if(isUnitRow) ws["!merges"].push({s:{r:R,c:0}, e:{r:R,c:lastCol}});
    if(noteRows && noteRows.has(R)){
      // 底部提醒列：整列合併＋依設定上色
      ws["!merges"].push({s:{r:R,c:0}, e:{r:R,c:lastCol}});
      const cell = ws[XLSX.utils.encode_cell({r:R,c:0})];
      if(cell){
        const [bg,fg] = NOTE_XLSX[noteRows.get(R)] || NOTE_XLSX.plain;
        cell.s = {alignment:{horizontal:"left", vertical:"center"}, font:{name:F, sz:10, bold:true, color:{rgb:fg}}, ...(bg?{fill:{patternType:"solid", fgColor:{rgb:bg}}}:{})};
      }
      continue;
    }
    for(let C=range.s.c; C<=range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(!cell) continue;
      if(R===0){
        cell.s = {alignment:center, font:{name:F, sz:14, bold:true}};
      }else if(isUnitRow){
        cell.s = {alignment:{horizontal:"left", vertical:"center"}, font:{name:F, sz:11, bold:true, color:{rgb:"FFFFFF"}}, fill:{patternType:"solid", fgColor:{rgb:"1D4ED8"}}, border};
      }else if(R===1){
        cell.s = {alignment:center, font:{name:F, sz:10, bold:true}, fill:{patternType:"solid", fgColor:{rgb:"F1F5F9"}}, border};
      }else if(R===2){
        // 星期列：六日上色
        const isWknd = (cell.v==="六" || cell.v==="日");
        cell.s = {alignment:center, font:{name:F, sz:10, bold:true, color:isWknd?{rgb:"C2410C"}:undefined}, fill:{patternType:"solid", fgColor:{rgb:isWknd?"FFEDD5":"F1F5F9"}}, border};
      }else{
        const isDayCol = C>=4 && C<4+dim;
        const s = {alignment:center, font:{name:F, sz:10}, border};
        if(C===1 && pickerRows && pickerRows.has(R)){
          // 理貨員姓名淺藍底
          s.fill = {patternType:"solid", fgColor:{rgb:"DBEAFE"}};
          s.font = {name:F, sz:10, bold:true, color:{rgb:"1E40AF"}};
        }
        if(isDayCol){
          const v = String(cell.v);
          if(lateSet && lateSet.has(`${R}:${C}`)){
            s.fill = {patternType:"solid", fgColor:{rgb:"F87171"}};
            s.font = {name:F, sz:10, bold:true, color:{rgb:"7F1D1D"}};
          }else if(CODE_XLSX[v]){
            s.fill = {patternType:"solid", fgColor:{rgb:CODE_XLSX[v][0]}};
            s.font = {name:F, sz:10, bold:true, color:{rgb:CODE_XLSX[v][1]}};
          }else if(v==="1" || v==="0.5"){
            s.font = {name:F, sz:10, color:{rgb:v==="1"?"16A34A":"0D9488"}};
          }else if(v==="X"){
            s.font = {name:F, sz:10, strike:true, color:{rgb:"94A3B8"}};
          }
        }
        cell.s = s;
      }
    }
  }
}
function diffSheet(m){
  const diffs = monthDiffs(m);
  if(!diffs.length) return null;
  const at = monthSubmittedAt(m);
  const rows = [[`${yy}年${m}月 遞交後異動清單（遞交時間：${at?fmtSubDate(at):"—"}）`],
                ["姓名","工號","日期","遞交時","改為"]];
  for(const d of diffs) rows.push([d.name, d.emp_no, `${m}/${d.day}`, d.from||"空", d.to||"空"]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:10},{wch:8},{wch:8},{wch:8},{wch:8}];
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:4}}];
  const center = {horizontal:"center", vertical:"center"};
  const F = "微軟正黑體";
  const border = {top:{style:"thin",color:{rgb:"CBD5E1"}},bottom:{style:"thin",color:{rgb:"CBD5E1"}},left:{style:"thin",color:{rgb:"CBD5E1"}},right:{style:"thin",color:{rgb:"CBD5E1"}}};
  const range = XLSX.utils.decode_range(ws["!ref"]);
  for(let R=range.s.r; R<=range.e.r; R++) for(let C=range.s.c; C<=range.e.c; C++){
    const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
    if(!cell) continue;
    if(R===0) cell.s = {alignment:center, font:{name:F, sz:12, bold:true}};
    else if(R===1) cell.s = {alignment:center, font:{name:F, sz:10, bold:true}, fill:{patternType:"solid", fgColor:{rgb:"F1F5F9"}}, border};
    else cell.s = {alignment:center, font:{name:F, sz:10, bold:C===4, color:C===4?{rgb:"DC2626"}:undefined}, fill:C===4?{patternType:"solid", fgColor:{rgb:"FEE2E2"}}:undefined, border};
  }
  return ws;
}
$("expMonth").onclick = ()=>{
  const wb = XLSX.utils.book_new();
  const {rows, lateSet, noteRows, pickerRows} = monthAOA(mm);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  styleSheet(ws, mm, lateSet, noteRows, pickerRows);
  XLSX.utils.book_append_sheet(wb, ws, `${yy}.${String(mm).padStart(2,"0")}`);
  const dws = diffSheet(mm);
  if(dws) XLSX.utils.book_append_sheet(wb, dws, "遞交後異動");
  XLSX.writeFile(wb, `彰化轉運中心${yy}年${mm}月出勤表.xlsx`);
};
$("expYear").onclick = ()=>{
  const wb = XLSX.utils.book_new();
  for(let m=1;m<=12;m++){
    const {rows, lateSet, noteRows, pickerRows} = monthAOA(m);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    styleSheet(ws, m, lateSet, noteRows, pickerRows);
    XLSX.utils.book_append_sheet(wb, ws, `${yy}.${String(m).padStart(2,"0")}`);
  }
  XLSX.writeFile(wb, `彰化轉運中心${yy}年出勤表(全年).xlsx`);
};

/* ================= 名冊 ================= */
$("rosterBtn").onclick = ()=>{ renderRoster(); $("roster").style.display="flex"; };
function renderRoster(){
  const unitCell = e => isAdmin
    ? `<select onchange="setUnit(${e.id},this.value)">${["","發送","到著","冷鏈","籠車"].map(u=>`<option value="${u}" ${((e.unit||"")===u)?"selected":""}>${u===""?"未分類":u}</option>`).join("")}</select>`
    : (e.unit||"未分類");
  const pickerCell = e => isAdmin
    ? `<td style="text-align:center"><input type="checkbox" style="width:auto" ${e.is_picker?"checked":""} onchange="setPicker(${e.id},this.checked)"></td>`
    : `<td style="text-align:center">${e.is_picker?"✓":""}</td>`;
  $("rosterBody").innerHTML = employees.map(e=>`
    <tr class="${e.active?"":"inactive"}">
      <td>${e.seq===999?"":e.seq}</td><td ${e.is_picker?'style="background:#dbeafe;border-radius:6px"':""}>${e.name}${e.note?` <span class="unitTag" title="${e.note}">備註</span>`:""}</td><td>${e.emp_no}</td>
      <td>${unitCell(e)}</td>${pickerCell(e)}<td>${e.hire_date}</td>
      <td>${e.active?"在職":"停用"}</td>
      <td class="adminOnly"><button class="mini" onclick="toggleEmp(${e.id},${!e.active})">${e.active?"停用":"復職"}</button></td>
    </tr>`).join("");
}
window.setPicker = async (id, on)=>{
  if(!isAdmin) return;
  const j = await fnCall({action:"patch_employee", id, fields:{is_picker:on}});
  if(!j.ok){ alert("更新失敗："+(j.error||"")); return; }
  const e = employees.find(x=>x.id===id); if(e) e.is_picker=on;
  renderRoster(); render();
};
window.setUnit = async (id, u)=>{
  if(!isAdmin) return;
  const j = await fnCall({action:"patch_employee", id, fields:{unit:u}});
  if(!j.ok){ alert("更新失敗："+(j.error||"")); return; }
  const e = employees.find(x=>x.id===id); if(e) e.unit=u;
  render();
};
async function fnCall(payload){
  const res = await fetch(FN_URL, {method:"POST", headers:H, body:JSON.stringify({...payload, token:adminToken})});
  return res.json();
}
window.toggleEmp = async (id, act)=>{
  if(!isAdmin) return;
  const j = await fnCall({action:"patch_employee", id, fields:{active:act}});
  if(!j.ok){ alert("更新失敗："+(j.error||"")); return; }
  const e = employees.find(x=>x.id===id); if(e) e.active=act;
  renderRoster(); render();
};
$("addEmp").onclick = async ()=>{
  const name=$("nName").value.trim(), no=$("nNo").value.trim();
  if(!name||!no){ alert("姓名、工號必填"); return; }
  const j = await fnCall({action:"add_employee", seq:+($("nSeq").value)||999, name, emp_no:no, hire_date:$("nHire").value.trim(), unit:$("nUnit").value, is_picker:$("nPicker").checked});
  if(!j.ok){ alert("新增失敗："+(j.error||"工號可能重複")); return; }
  employees.push(j.employee);
  employees.sort((a,b)=>(a.seq-b.seq)||a.emp_no.localeCompare(b.emp_no));
  $("nSeq").value=$("nName").value=$("nNo").value=$("nHire").value=""; $("nUnit").value=""; $("nPicker").checked=false;
  renderRoster(); render();
};

/* ================= 年份 / 單位篩選 ================= */
(function(){
  const sel = $("yearSel");
  for(let y=115;y<=117;y++){ const o=document.createElement("option"); o.value=y; o.textContent=`民國${y}年`; sel.appendChild(o); }
  sel.value = yy;
  sel.onchange = ()=>{ yy=+sel.value; loadAll(); };
  $("unitSel").onchange = ()=>{ unitFilter=$("unitSel").value; render(); };
})();

/* ================= 空格填1 ================= */
$("fillBtn").onclick = ()=>{
  if(!isAdmin) return;
  const dim = daysInMonth(yy,mm);
  const {actives} = visibleGroups();
  if(!confirm(`將 ${yy}年${mm}月 目前顯示的 ${actives.length} 人所有空格填入「1」(上班)？\n已填的代碼不會被覆蓋。`)) return;
  let n=0;
  for(const e of actives){
    const rec = getRec(e.emp_no, mm);
    let changed = false;
    for(let d=1; d<=dim; d++) if(rec.days[d-1]===""){ rec.days[d-1]="1"; changed=true; n++; }
    if(changed) markDirty(e.emp_no, mm);
  }
  renderGrid();
  if(!n) alert("本月沒有空格，未做任何變更。");
};

/* ================= 列印 ================= */
$("printBtn").onclick = ev=>{
  ev.stopPropagation();
  const menu = $("printMenu");
  const show = menu.style.display!=="block";
  menu.style.display = show?"block":"none";
  if(show){
    const r = $("printBtn").getBoundingClientRect();
    menu.style.top = (r.bottom + window.scrollY + 4)+"px";
    menu.style.left = Math.min(r.left + window.scrollX, window.innerWidth-170)+"px";
  }
};
document.addEventListener("click", e=>{ if(!$("printMenu").contains(e.target) && e.target.id!=="printBtn") $("printMenu").style.display="none"; });
window.doPrint = size=>{
  $("printMenu").style.display="none";
  let st = $("pageStyle");
  if(!st){ st=document.createElement("style"); st.id="pageStyle"; document.head.appendChild(st); }
  st.textContent = `@page{size:${size} landscape; margin:8mm;}`;
  const uTxt = unitFilter==="all" ? "" : `（${UNIT_LABEL[unitFilter]}）`;
  const now = new Date();
  $("printTitle").innerHTML = `新竹物流彰化轉運中心 ${yy}.${String(mm).padStart(2,"0")} 勤怠表${uTxt}<small>列印：${now.getFullYear()-1911}/${now.getMonth()+1}/${now.getDate()}</small>`;
  window.print();
};
</script>
